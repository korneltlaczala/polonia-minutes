<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
</head>

{% load static %}

<body>
    <h1>Home</h1>
    <h3>Choose team</h3>
    <ul>
        {% for team in club.teams %}
            <li>{{ team }}</li>
            {% for league in team.get_leagues %}
                <li>{{ league }}</li>
            {% endfor %}
        {% endfor %}
    </ul>
</body>
</html>
