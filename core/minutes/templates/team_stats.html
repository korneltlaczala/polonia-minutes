{% load static %}

<div class="player-container player-container-stats"></div>

<script>
let playersData = [];  // store globally so we can sort multiple times
let currentSort = { key: 'goal_count', order: 'desc' }; // default sort

function renderTable(sortKey = 'goal_count', sortOrder = 'desc') {
    const playerContainer = document.querySelector('.player-container-stats');
    playerContainer.innerHTML = '';

    if (!playersData || playersData.length === 0) {
        playerContainer.innerHTML = 'No players found';
        return;
    }

    const table = document.createElement('table');
    table.classList.add('player-table');

    // table headers with click handlers
    const headerRow = document.createElement('tr');
    headerRow.innerHTML = `
        <th data-key="name">Zawodnik</th>
        <th data-key="goal_count">Bramki</th>
        <th data-key="goals_per_90">Bramki na 90'</th>
        <th data-key="yellow_cards">Żółte kartki</th>
    `;
    table.appendChild(headerRow);

    // sorting
    playersData.sort((a, b) => {
        let valA, valB;
        if (sortKey === 'name') {
            valA = `${a.firstname} ${a.lastname}`;
            valB = `${b.firstname} ${b.lastname}`;
        } else {
            valA = a[sortKey];
            valB = b[sortKey];
        }

        if (valA < valB) return sortOrder === 'asc' ? -1 : 1;
        if (valA > valB) return sortOrder === 'asc' ? 1 : -1;
        return 0;
    });

    // render rows
    playersData.forEach(player => {
        const row = document.createElement('tr');
        row.classList.add('player-row');
        const playerUrl = "{% url 'player' 'PLAYER_ID' %}".replace('PLAYER_ID', player.id);
        row.innerHTML = `
            <td><a href="${playerUrl}"><button>${player.firstname} ${player.lastname}</button></a></td>
            <td><cell>${player.goal_count}</cell></td>
            <td><cell>${player.goals_per_90}</cell></td>
            <td><cell>${player.yellow_cards}</cell></td>
        `;
        table.appendChild(row);
    });

    playerContainer.appendChild(table);

    // add sorting click events
    headerRow.querySelectorAll('th').forEach(th => {
        th.addEventListener('click', () => {
            const key = th.dataset.key;
            let order = 'asc';

            if (currentSort.key === key && currentSort.order === 'asc') {
                order = 'desc';
            }

            currentSort = { key, order };
            renderTable(key, order);
        });
    });
}

        .then(response => response.json())
        .then(data => {
            playersData = data.players || [];
            renderTable(currentSort.key, currentSort.order);
        });
}
</script>
